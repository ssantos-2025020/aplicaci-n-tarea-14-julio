<div class="cliente-list">
  <h3>Listado de Clientes</h3>

  <p *ngIf="cargando">Cargando...</p>
  <p class="error" *ngIf="mensajeError">{{ mensajeError }}</p>

  <table *ngIf="!cargando && clientes.length > 0">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Teléfono</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cliente of clientes">
        <td>{{ cliente.codigoCliente }}</td>
        <td>{{ cliente.nombreCliente }}</td>
        <td>{{ cliente.direccionCliente }}</td>
        <td>{{ cliente.telefonoCliente }}</td>
        <td><button (click)="eliminar(cliente.codigoCliente)">Eliminar</button></td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando && clientes.length === 0">No hay clientes registrados.</p>
</div>
